name: CareerAI Database

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - "prisma/seed.ts"
      - "prisma/assessment-seed.ts"

jobs:
  database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Synchronize Prisma schema
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Seed application data
        run: npx prisma db seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_SEED_EMAIL: ${{ secrets.ADMIN_SEED_EMAIL }}
          ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}

      - name: Seed assessment questions
        run: npm run seed:assessment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
